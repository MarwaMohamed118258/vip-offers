<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة التحكم · عروض VIP</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4B1F7A">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin">
  <header class="app-header">
    <div class="container row">
      <div class="brand-badge">VIP</div>
      <div style="flex:1"><h1>لوحة التحكم</h1><p id="who">سجّلي دخول الأول</p></div>
      <button id="logout" class="btn btn-sm btn-yellow" hidden>خروج</button>
    </div>
  </header>

  <main class="container">
    <!-- تسجيل الدخول -->
    <section id="login-view" class="panel" hidden>
      <form id="login-form" class="form-grid">
        <div class="field"><label for="email">الإيميل</label><input id="email" class="input" type="email" autocomplete="username" required dir="ltr"></div>
        <div class="field"><label for="password">الباسورد</label><input id="password" class="input" type="password" autocomplete="current-password" required dir="ltr"></div>
        <button class="btn btn-purple btn-block" type="submit">دخول</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="admin-view" hidden>
      <div class="admin-tabs">
        <button class="btn btn-purple" data-tab="offers">العروض</button>
        <button class="btn btn-ghost" data-tab="about">مانجر مروة</button>
      </div>

      <!-- العروض -->
      <div id="tab-offers">
        <div class="panel">
          <h2 class="section-title" id="form-title">عرض جديد</h2>
          <form id="offer-form" class="form-grid">
            <div class="field"><label for="o-company">الشركة</label><input id="o-company" class="input" list="companies" required></div>
            <datalist id="companies"></datalist>
            <div class="field"><label for="o-category">القسم</label><select id="o-category" class="select" required></select></div>
            <div class="field"><label for="o-name">اسم العرض</label><input id="o-name" class="input" required></div>
            <div class="field"><label for="o-image">رابط صورة (اختياري)</label><input id="o-image" class="input" type="url" dir="ltr" placeholder="https://..."></div>

            <h3 class="section-title" style="margin:8px 0 0">المنتجات</h3>
            <div id="products" class="form-grid"></div>
            <button type="button" id="add-product" class="btn btn-ghost">+ ضيفي منتج</button>

            <div class="calc-box" id="calc"></div>

            <div class="row-gap">
              <button type="submit" class="btn btn-purple" style="flex:1" id="save-btn">حفظ العرض</button>
              <button type="button" class="btn btn-ghost" id="cancel-edit" hidden>إلغاء التعديل</button>
            </div>
            <p id="offer-msg" class="error" hidden></p>
          </form>
        </div>

        <!-- بيظهر بعد حفظ عرض جديد -->
        <div class="panel" id="push-panel" hidden>
          <h2 class="section-title">بلّغي العملاء بالعرض الجديد</h2>
          <div class="calc-box" style="font-weight:600">
            <div><b>العنوان:</b> <span id="push-title"></span></div>
            <div><b>الرسالة:</b> <span id="push-message"></span></div>
          </div>
          <button type="button" id="push-btn" class="btn btn-yellow btn-block" style="margin-top:12px">ابعتي إشعار للعملاء</button>
          <p class="meta" style="margin:8px 0 0">الزرار بينسخ النص ويفتح صفحة الإرسال في OneSignal. الصقي العنوان في Title والرسالة في Message.</p>
          <p id="push-msg" class="error" hidden></p>
        </div>

        <div class="panel">
          <div class="row-gap" style="justify-content:space-between;align-items:center;margin-bottom:10px">
            <h2 class="section-title" style="margin:0">العروض الحالية</h2>
            <button type="button" id="sample-btn" class="btn btn-sm btn-yellow">ضيفي عرض تجريبي</button>
          </div>
          <div id="admin-offers" class="admin-list"><p class="state-msg">جاري التحميل…</p></div>
        </div>
      </div>

      <!-- مانجر مروة -->
      <div id="tab-about" hidden>
        <div class="panel">
          <form id="about-form" class="form-grid">
            <div class="field"><label for="a-name">الاسم</label><input id="a-name" class="input" placeholder="مانجر مروة"></div>
            <div class="field"><label for="a-photo">رابط الصورة</label><input id="a-photo" class="input" type="url" dir="ltr" placeholder="https://..."></div>
            <div class="field"><label for="a-bio">نبذة قصيرة</label><textarea id="a-bio" class="textarea"></textarea></div>
            <div class="field"><label for="a-years">سنين الخبرة</label><input id="a-years" class="input" type="number" min="0" inputmode="numeric"></div>
            <div class="field"><label for="a-courses">الكورسات (كل كورس في سطر)</label><textarea id="a-courses" class="textarea"></textarea></div>
            <div class="field"><label for="a-reviews">روابط صور آراء العملاء (كل رابط في سطر، ومن غير أسماء العملاء)</label><textarea id="a-reviews" class="textarea" dir="ltr"></textarea></div>
            <button type="submit" class="btn btn-purple btn-block">حفظ الصفحة</button>
            <p id="about-msg" class="error" hidden></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <template id="product-tpl">
    <div class="product-row">
      <div class="field"><label>اسم المنتج</label><input class="input" data-f="name" required></div>
      <div class="nums">
        <div class="field"><label>الكمية</label><input class="input" data-f="qty" type="number" min="1" value="1" inputmode="numeric" required></div>
        <div class="field"><label>سعر الجمهور</label><input class="input" data-f="publicPrice" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        <div class="field"><label>سعر العرض</label><input class="input" data-f="offerPrice" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        <button type="button" class="icon-btn" data-remove aria-label="امسحي المنتج">×</button>
      </div>
    </div>
  </template>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
